spring.application.name=inventory

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# optional but sometimes necessary
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.show-sql=true
# tell Hibernate explicitly (optional but helpful)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# or (Spring alias)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# JPA config
spring.jpa.hibernate.ddl-auto=update
server.port=8081


#kafka
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory
spring.kafka.template.default-topic=order_topic
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer


#eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

