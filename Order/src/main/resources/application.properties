spring.application.name=order


spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# optional but sometimes necessary
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.show-sql=true
# tell Hibernate explicitly (optional but helpful)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# or (Spring alias)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# JPA config
spring.jpa.hibernate.ddl-auto=update
server.port=8082

#kafka
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.template.default-topic=order_topic


#eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/